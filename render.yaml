services:
  - type: web
    name: ak-mobile-shop-backend
    plan: free
    runtime: docker
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        value: "postgresql://USER:PASSWORD@HOST:PORT/DATABASE"
      - key: SUPER_ADMIN_USERNAME
        value: "CHANGE_ME"
      - key: SUPER_ADMIN_PASSWORD
        value: "CHANGE_ME"
